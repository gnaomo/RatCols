<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RatCols</title>
<style>
    :root {
        --bg: #14161a;
        --panel: #1c1f26;
        --border: #2c303a;
        --text: #e6e8eb;
        --muted: #8a8f99;
        --accent: #6ea8fe;
        --desc: #b0b8c0;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, monospace;
    }

    /* toolbars */
    .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        flex-shrink: 0;
    }
    .toolbar-group { display: flex; align-items: center; gap: 6px; }
    /* shown on Naming + Load list while Sync is on, so it's visually
       obvious those two groups are currently linked together */
    .toolbar-group.sync-linked {
        outline: 1px solid var(--accent);
        outline-offset: 3px;
        border-radius: 4px;
    }
    .toolbar-label {
        font-size: 10px;
        letter-spacing: .05em;
        text-transform: uppercase;
        color: var(--muted);
        margin-right: 2px;
        flex-shrink: 0;
    }
    .game-btn {
        font-family: inherit;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .02em;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
    }
    .game-btn:hover { border-color: var(--accent); }
    .game-btn.active { background: var(--accent); border-color: var(--accent); color: #10131a; }

    /* panes */
    .panes { flex: 1; display: flex; min-height: 0; }
    .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .pane + .pane { border-left: 1px solid var(--border); }
    .pane-header {
        padding: 10px 14px;
        font-size: 12px;
        letter-spacing: .05em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        flex-shrink: 0;
    }
    .levels { flex: 1; overflow-y: auto; }
    .empty { padding: 20px 14px; color: var(--muted); font-size: 13px; }

    /* level / id-group headers */
    .level-title, .id-header {
        position: sticky;
        top: 0;
        background: #10131a;
        z-index: 1;
    }
    .level-title {
        color: var(--accent);
        font-size: 12px;
        letter-spacing: .04em;
        padding: 8px 14px;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
    }

    /* rows */
    .row {
        display: flex;
        align-items: center;
        font-size: 13px;
        border-bottom: 1px solid var(--border);
        padding: 2px 0;
        gap: 6px;
    }
    .row:hover { background: rgba(255, 255, 255, 0.02); }
    .swatch {
        width: 72px;
        min-width: 72px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: .02em;
        border-radius: 3px;
        margin-left: 4px;
        flex-shrink: 0;
    }
    .info {
        padding: 0 8px 0 10px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        min-width: 0;
        flex-wrap: wrap;
    }
    .info .id { color: var(--accent); min-width: 100px; font-weight: 500; flex-shrink: 0; }
    .info .desc {
        color: var(--desc);
        font-size: 12px;
        flex: 1;
        min-width: 120px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* level sub-rows (inside an id-group block) */
    .level-sub-row {
        display: flex;
        align-items: center;
        font-size: 12px;
        border-bottom: 1px solid var(--border);
        padding: 2px 0 2px 92px;
        gap: 12px;
    }
    .level-sub-row:hover { background: rgba(255, 255, 255, 0.02); }
    .level-sub-row .level-name {
        color: var(--desc);
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* shared stat-group styling (row + level-sub-row) */
    .info .stat-group, .level-sub-row .stat-group {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        margin-left: auto;
    }
    .info .label, .level-sub-row .label { color: var(--muted); font-size: 11px; }
    .info .faces, .info .verts,
    .level-sub-row .faces, .level-sub-row .verts {
        color: var(--text);
        font-variant-numeric: tabular-nums;
        min-width: 50px;
        text-align: right;
    }

    /* below this width, two side-by-side panes get too cramped to read;
       stack them into one scrollable column instead */
    @media (max-width: 900px) {
        body { height: auto; overflow-y: auto; }
        .panes { flex-direction: column; }
        .pane { flex: none; }
        .pane + .pane { border-left: none; border-top: 1px solid var(--border); }
        .levels { overflow-y: visible; }
    }

    @media (max-width: 780px) {
        .info .desc { white-space: normal; min-width: 80px; font-size: 11px; }
        .info .id { min-width: 70px; font-size: 12px; }
        .swatch { width: 56px; min-width: 56px; height: 26px; font-size: 8px; }
        .info .stat-group { margin-left: 0; width: 100%; justify-content: flex-start; padding-top: 2px; }
        .row { flex-wrap: wrap; padding: 4px 0; }
    }
</style>
</head>
<body>

<div class="panes">
    <div class="pane" id="paneA">
        <div class="toolbar" id="toolbarA"></div>
        <div class="pane-header"><span></span><span id="countA">0 rows</span></div>
        <div class="levels" id="levelsA"></div>
    </div>

    <div class="pane" id="paneB">
        <div class="toolbar" id="toolbarB"></div>
        <div class="pane-header"><span></span><span id="countB">0 rows</span></div>
        <div class="levels" id="levelsB"></div>
    </div>
</div>

<script src="data/rac1_levels.js"></script>
<script src="data/gc_levels.js"></script>
<script src="data/uya_levels.js"></script>
<script src="data/dl_levels.js"></script>
<script src="data/mp_uya_levels.js"></script>
<script src="data/mp_dl_levels.js"></script>
<script src="data/qwark_vidcomics_levels.js"></script>
<script>
    const LEVEL_RE = /^==\s*(.+?)\s*==\s*$/;
    const ROW_RE = /^\s*(col_[0-9a-fA-F]+|hero_group_collision)\s+faces=\s*([\d,]+)\s+verts=\s*([\d,]+)/i;
    const HERO_COLOR = '#0000ff';
    const HERO_NOTE = 'blocks hero but not other mobies (camera,veichles,projectiles)';

    // ─── Collision ID notes (user-supplied) ──────────────────────────────
    // Keyed by hex digit '0'-'F' (the low/Y nibble, the only part with known
    // meaning). BASE_NOTES holds the shared RAC1/UYA/DL scheme; each game's
    // entry in GAME_NOTES starts from that base and only overrides the ids
    // that are known to differ, so real per-game differences stay visible
    // instead of being buried in four near-identical copies of the table.
    const BASE_NOTES = {
        '0': 'swimming',
        '1': 'lava bounce',
        '2': 'magneboots surface',
        '3': 'sinking mud (can be jump out of)',
        '4': 'bodysliding (water/quartu slide)',
        '5': 'hoverboard ramp',
        '6': '(unused) walkable unk attr',
        '7': 'slippery ice',
        '8': 'non walkable',
        '9': 'walkable w/out ledgegrab',
        'A': 'walkable w/out wall jump',
        'B': 'inescapable mud',
        'C': 'non walkable (w/out ledgegrab / wall jump)',
        'D': 'insta ice cube death',
        'E': 'walkable w/ water ripples',
        'F': 'walkable w/ ledgegrab',
    };

    const GAME_NOTES = {
        rac1: { ...BASE_NOTES },
        gc: {
            ...BASE_NOTES,
            '4': 'bodysliding',
            '5': 'hoverbike ramp',
            '6': 'spiderbot + something to do with spaceship fight',
            '7': 'hoverbike slippery mud (joba), unknown interaction w/ ratchet alone (grelbin),',
            'E': '(unused) walkable w/ water ripples (maybe idk needs research)', 
        },
        uya: { 
             ...BASE_NOTES,
            '3': '(unused) sinking mud (can be jump out of)',
            '4': '(unused) bodysliding',
            '5': 'turboslide ramp',
            '7': '(unused) slippery ice',
            'E': '(unused) walkable w/ water ripples', 
        },
        dl: { 
             ...BASE_NOTES,
            '0': '(unused) water (needs research)',
            '1': 'i have no idea',
            '3': 'i have no idea',
            '4': 'i have no idea',
            '5': '(unused, needs research)',
            '6': '(unused, needs research)',
            '7': '(unused, needs research)',
            'A': '(unused) walkable? (needs research)',
            'E': '(unused) walkable w/ water ripples? (needs research)',
        },
        mp_uya: { 
             ...BASE_NOTES,
            '3': '(unused, needs research)',
            '4': '(semi-unused, unreachable spot) bodysliding',
            '5': 'turboslide ramp',
            '6': '(unused, needs research)',
            '7': '(unused, needs research)',
            'A': '(unused, needs research)',
            'E': '(unused) walkable w/ water ripples? (needs research)',
        },
        mp_dl: { 
             ...BASE_NOTES,
            '0': '(unused) water (needs research)',
            '1': 'i have no idea',
            '3': 'i have no idea',
            '4': 'i have no idea',
            '5': '(unused, needs research)',
            '6': '(unused, needs research)',
            '7': '(unused, needs research)',
            'A': '(unused) walkable? (needs research)',
            'E': '(unused) walkable w/ water ripples? (needs research)',
        },
        qwark_vidcomics: { 
             ...BASE_NOTES,
            '9': 'i have no idea',
            'C': 'i have no idea',
            'F': 'walkable',
        },
    };

    // ─── Preloaded collision id survey lists (per game) ─────────────────
    // Independent of the naming table above — a pane can show any list
    // regardless of which game's naming it currently uses.
    const LEVEL_LISTS = {
        rac1: RAC1_LEVELS,
        gc: GC_LEVELS,
        uya: UYA_LEVELS,
        dl: DL_LEVELS,
        mp_uya: MP_UYA_LEVELS,
        mp_dl: MP_DL_LEVELS,
        qwark_vidcomics: QWARK_VIDCOMICS_LEVELS,
    };

    const NAMING_OPTIONS = [
        ['rac1', 'RAC1'], ['gc', 'GC'], ['uya', 'UYA'], ['dl', 'DL'],
        ['mp_uya', 'MP UYA'], ['mp_dl', 'MP DL'], ['qwark_vidcomics', 'Vidcomics'],
    ];
    const LIST_OPTIONS = NAMING_OPTIONS; // same set of games
    const GROUP_OPTIONS = [['planet', 'Planet'], ['id', 'Collision ID']];

    // ─── Color formula from replanetizer/wrench (engine/collision.cpp) ──
    function collisionIdToHex(id) {
        const r = (id & 0x3) << 6;
        const g = (id & 0xc) << 4;
        const b = (id & 0xf0);
        return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
    }

    function brightness(hex) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return (r * 299 + g * 587 + b * 114) / 1000;
    }

    function statGroupHTML(pairs) {
        return pairs.map(([label, val]) =>
            `<span class="label">${label}</span><span class="faces">${val}</span>`
        ).join('');
    }

    // ─── Row builders ────────────────────────────────────────────────────
    function makeRow(label, faces, verts, hex, note, isHero) {
        const row = document.createElement('div');
        row.className = 'row';

        const swatch = document.createElement('div');
        swatch.className = 'swatch';
        swatch.style.background = hex;
        swatch.style.color = brightness(hex) > 128 ? '#000' : '#fff';
        swatch.textContent = hex;

        const info = document.createElement('div');
        info.className = 'info';

        const idSpan = document.createElement('span');
        idSpan.className = 'id';
        idSpan.textContent = label;

        const descSpan = document.createElement('span');
        descSpan.className = 'desc';
        const text = note || (isHero ? HERO_NOTE : null);
        if (text) {
            descSpan.textContent = text;
        } else {
            descSpan.textContent = '—';
            descSpan.style.color = 'var(--muted)';
            descSpan.style.fontStyle = 'italic';
        }

        const statGroup = document.createElement('span');
        statGroup.className = 'stat-group';
        statGroup.innerHTML = statGroupHTML([['faces', faces], ['verts', verts]]);

        info.append(idSpan, descSpan, statGroup);
        row.append(swatch, info);
        return row;
    }

    // Merges level sub-rows that share the same level NAME (a level often
    // has several separate collision mesh chunks, each logged as its own
    // row) into one row, summing their faces/verts. Only meaningful within
    // a Collision ID group block.
    function dedupEntries(entries) {
        const merged = new Map();
        for (const e of entries) {
            const key = e.level;
            if (!merged.has(key)) {
                merged.set(key, { level: e.level, facesNum: 0, vertsNum: 0, count: 0 });
            }
            const m = merged.get(key);
            m.facesNum += e.facesNum;
            m.vertsNum += e.vertsNum;
            m.count++;
        }
        return [...merged.values()].map(m => ({
            level: m.count > 1 ? `${m.level} (×${m.count}, summed)` : m.level,
            faces: m.facesNum.toLocaleString(),
            verts: m.vertsNum.toLocaleString(),
        }));
    }

    function makeIdBlock(group, dedupEnabled) {
        const block = document.createElement('div');
        block.className = 'id-block';

        const header = document.createElement('div');
        header.className = 'row id-header';

        const swatch = document.createElement('div');
        swatch.className = 'swatch';
        swatch.style.background = group.hex;
        swatch.style.color = brightness(group.hex) > 128 ? '#000' : '#fff';
        swatch.textContent = group.hex;

        const info = document.createElement('div');
        info.className = 'info';

        const idSpan = document.createElement('span');
        idSpan.className = 'id';
        idSpan.textContent = group.label;

        const descSpan = document.createElement('span');
        descSpan.className = 'desc';
        if (group.note) {
            descSpan.textContent = group.note;
        } else {
            descSpan.textContent = '—';
            descSpan.style.color = 'var(--muted)';
            descSpan.style.fontStyle = 'italic';
        }

        const statGroup = document.createElement('span');
        statGroup.className = 'stat-group';
        statGroup.innerHTML = statGroupHTML([
            ['planets', group.entries.length],
            ['faces', group.totalFaces.toLocaleString()],
            ['verts', group.totalVerts.toLocaleString()],
        ]);

        info.append(idSpan, descSpan, statGroup);
        header.append(swatch, info);
        block.appendChild(header);

        const entries = dedupEnabled ? dedupEntries(group.entries) : group.entries;
        for (const entry of entries) {
            const sub = document.createElement('div');
            sub.className = 'level-sub-row';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'level-name';
            nameSpan.textContent = entry.level;

            const subStats = document.createElement('span');
            subStats.className = 'stat-group';
            subStats.innerHTML = statGroupHTML([['faces', entry.faces], ['verts', entry.verts]]);

            sub.append(nameSpan, subStats);
            block.appendChild(sub);
        }

        return block;
    }

    // ─── Pane state ─────────────────────────────────────────────────────
    // Two fully independent preview panes, each with its own data source
    // (list), grouping mode, naming table, byte-grouping toggle, naming/list
    // sync, and row dedup — so different games/levels, groupings, naming
    // schemes, and nibble modes can all be compared side by side with
    // nothing shared between panes.
    //
    // ignoreX: when true, rows/blocks are keyed by the low nibble (Y) of
    // the collision byte only; the high nibble (X, meaning unknown) is
    // ignored and entries that differ only in X are merged together.
    // sync: when true, picking a Naming option also selects the same game
    // in Load list on this pane (and vice versa) — they usually should
    // match, this just saves the second click.
    // dedup: when true (only takes effect when Group by = Collision ID),
    // collision-id sub-rows for the same level name (a level often has
    // several separate mesh chunks logged as separate rows) are merged
    // into a single row with faces and verts summed.
    const panes = {
        A: {
            listKey: 'rac1',
            groupMode: 'planet',
            naming: 'rac1',
            ignoreX: true,
            sync: true,
            dedup: true,
            levelsEl: document.getElementById('levelsA'),
            countEl: document.getElementById('countA'),
        },
        B: {
            listKey: 'rac1',
            groupMode: 'planet',
            naming: 'rac1',
            ignoreX: true,
            sync: true,
            dedup: true,
            levelsEl: document.getElementById('levelsB'),
            countEl: document.getElementById('countB'),
        },
    };

    function render(pane) {
        const dataStr = LEVEL_LISTS[pane.listKey] || '';
        if (pane.groupMode === 'id') {
            renderByCollisionId(dataStr, pane);
        } else {
            renderByPlanet(dataStr, pane);
        }
    }

    function renderAll() {
        render(panes.A);
        render(panes.B);
    }

    // Shared per-row classification: works out the display key/label/color/
    // note for one collision-list line, given the pane's active naming table
    // and ignoreX setting. Used by both group-by-planet and group-by-id
    // rendering so the two stay in sync.
    function classifyRow(label, pane) {
        if (/^hero_group_collision$/i.test(label)) {
            return { key: 'HERO', dispLabel: label, hex: HERO_COLOR, note: HERO_NOTE, isHero: true };
        }
        const hexKey = label.replace(/^col_/i, '').toUpperCase();
        const id = parseInt(hexKey, 16);
        const yDigit = hexKey.slice(-1); // low nibble (Y) -- the only part with known meaning
        const note = GAME_NOTES[pane.naming][yDigit] || null;
        if (pane.ignoreX) {
            return { key: yDigit, dispLabel: 'col_*' + yDigit.toLowerCase(), hex: collisionIdToHex(id & 0x0F), note, isHero: false };
        }
        return { key: hexKey, dispLabel: 'col_' + hexKey.toLowerCase(), hex: collisionIdToHex(id), note, isHero: false };
    }

    function renderByPlanet(dataStr, pane) {
        const frag = document.createDocumentFragment();
        let n = 0;
        let sectionRows = []; // buffered rows for the section currently being read

        function flushSection() {
            if (sectionRows.length === 0) return;
            if (pane.ignoreX) {
                // merge rows that share the same Y (low nibble) key
                const merged = new Map();
                for (const r of sectionRows) {
                    if (!merged.has(r.key)) merged.set(r.key, { ...r, faces: 0, verts: 0 });
                    const m = merged.get(r.key);
                    m.faces += r.facesNum;
                    m.verts += r.vertsNum;
                }
                for (const m of merged.values()) {
                    frag.appendChild(makeRow(m.label, m.faces.toLocaleString(), m.verts.toLocaleString(), m.hex, m.note, m.isHero));
                }
            } else {
                for (const r of sectionRows) {
                    frag.appendChild(makeRow(r.label, r.faces, r.verts, r.hex, r.note, r.isHero));
                }
            }
            sectionRows = [];
        }

        for (const line of dataStr.split('\n')) {
            const levelMatch = line.match(LEVEL_RE);
            if (levelMatch) {
                flushSection();
                const title = document.createElement('div');
                title.className = 'level-title';
                title.textContent = levelMatch[1];
                frag.appendChild(title);
                continue;
            }

            const rowMatch = line.match(ROW_RE);
            if (!rowMatch) continue;
            const [, label, faces, verts] = rowMatch;
            n++;

            const c = classifyRow(label, pane);
            sectionRows.push({
                key: c.key, label: c.dispLabel, faces, verts,
                facesNum: parseInt(faces.replace(/,/g, ''), 10) || 0,
                vertsNum: parseInt(verts.replace(/,/g, ''), 10) || 0,
                hex: c.hex, note: c.note, isHero: c.isHero,
            });
        }
        flushSection();

        pane.levelsEl.innerHTML = '';
        if (n === 0) {
            pane.levelsEl.innerHTML = '<div class="empty">No data loaded. Pick a list above.</div>';
        } else {
            pane.levelsEl.appendChild(frag);
        }
        pane.countEl.textContent = `${n} row${n === 1 ? '' : 's'}`;
    }

    function renderByCollisionId(dataStr, pane) {
        let currentLevel = null;
        const groups = new Map(); // key -> group

        for (const line of dataStr.split('\n')) {
            const levelMatch = line.match(LEVEL_RE);
            if (levelMatch) { currentLevel = levelMatch[1]; continue; }

            const rowMatch = line.match(ROW_RE);
            if (!rowMatch) continue;
            const [, label, faces, verts] = rowMatch;

            const c = classifyRow(label, pane);
            if (!groups.has(c.key)) {
                groups.set(c.key, { hex: c.hex, note: c.note, label: c.dispLabel, entries: [], totalFaces: 0, totalVerts: 0 });
            }
            const group = groups.get(c.key);
            const facesNum = parseInt(faces.replace(/,/g, ''), 10) || 0;
            const vertsNum = parseInt(verts.replace(/,/g, ''), 10) || 0;
            group.entries.push({ level: currentLevel || '(unknown)', faces, verts, facesNum, vertsNum });
            // totalFaces/totalVerts always reflect every real entry, dedup or
            // not — dedup only merges how the sub-rows are *displayed* below.
            group.totalFaces += facesNum;
            group.totalVerts += vertsNum;
        }

        // sort ascending by numeric id, hero_group_collision last
        const keys = [...groups.keys()].sort((a, b) => {
            if (a === 'HERO') return 1;
            if (b === 'HERO') return -1;
            return parseInt(a, 16) - parseInt(b, 16);
        });

        const frag = document.createDocumentFragment();
        let n = 0;
        for (const key of keys) {
            const group = groups.get(key);
            n += group.entries.length;
            frag.appendChild(makeIdBlock(group, pane.dedup));
        }

        pane.levelsEl.innerHTML = '';
        if (n === 0) {
            pane.levelsEl.innerHTML = '<div class="empty">No data loaded. Pick a list above.</div>';
        } else {
            pane.levelsEl.appendChild(frag);
        }
        pane.countEl.textContent = `${n} row${n === 1 ? '' : 's'} across ${keys.length} id${keys.length === 1 ? '' : 's'}`;
    }

    // ─── Toolbar building ───────────────────────────────────────────────
    // Builds one <div class="toolbar-group"> of game-btn buttons wired to
    // call onChange(value) and highlight whichever button is active.
    // Returns { el, setActive } — setActive() lets another control move
    // the highlighted button programmatically (no onChange re-fire), which
    // is what the Naming<->Load list sync needs.
    function buildToolbarGroup(label, options, activeValue, onChange) {
        const group = document.createElement('div');
        group.className = 'toolbar-group';

        const lbl = document.createElement('span');
        lbl.className = 'toolbar-label';
        lbl.textContent = label;
        group.appendChild(lbl);

        const btns = [];
        for (const [value, text] of options) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'game-btn' + (value === activeValue ? ' active' : '');
            btn.textContent = text;
            btn.dataset.value = value;
            btn.addEventListener('click', () => {
                setActive(value);
                onChange(value);
            });
            group.appendChild(btn);
            btns.push(btn);
        }
        function setActive(value) {
            btns.forEach(b => b.classList.toggle('active', b.dataset.value === value));
        }
        return { el: group, setActive };
    }

    // Builds a single on/off toggle button as its own toolbar-group.
    // Returns { el, setActive, setEnabled } — setEnabled() lets Group-by
    // grey out the Dedup toggle when it isn't Collision ID mode.
    function buildToggleGroup(label, buttonText, title, active, onToggle) {
        const group = document.createElement('div');
        group.className = 'toolbar-group';

        const lbl = document.createElement('span');
        lbl.className = 'toolbar-label';
        lbl.textContent = label;
        group.appendChild(lbl);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'game-btn' + (active ? ' active' : '');
        btn.title = title;
        btn.textContent = buttonText;
        let enabled = true;
        btn.addEventListener('click', () => {
            if (!enabled) return;
            const next = !btn.classList.contains('active');
            btn.classList.toggle('active', next);
            onToggle(next);
        });
        group.appendChild(btn);

        return {
            el: group,
            setActive(v) { btn.classList.toggle('active', v); },
            setEnabled(v) {
                enabled = v;
                btn.disabled = !v;
                btn.style.opacity = v ? '' : '0.4';
                btn.style.cursor = v ? 'pointer' : 'not-allowed';
            },
        };
    }

    // Builds the full per-pane toolbar: Naming, Load list, Group by, Byte,
    // Sync, Dedup — each pane owns and controls all six independently of
    // the other pane.
    function buildPaneToolbar(pane) {
        const toolbarEl = document.getElementById('toolbar' + pane.key);

        const namingCtl = buildToolbarGroup('Naming', NAMING_OPTIONS, pane.naming, v => {
            pane.naming = v;
            if (pane.sync) { pane.listKey = v; listCtl.setActive(v); }
            render(pane);
        });
        const listCtl = buildToolbarGroup('Load list', LIST_OPTIONS, pane.listKey, v => {
            pane.listKey = v;
            if (pane.sync) { pane.naming = v; namingCtl.setActive(v); }
            render(pane);
        });
        const groupCtl = buildToolbarGroup('Group by', GROUP_OPTIONS, pane.groupMode, v => {
            pane.groupMode = v;
            dedupCtl.setEnabled(v === 'id');
            render(pane);
        });
        const byteCtl = buildToggleGroup(
            'Byte',
            'Ignore first nibble (group by last nibble)',
            'Group entries by the low nibble (Y) only, ignoring the high nibble (X) whose meaning is unknown',
            pane.ignoreX,
            v => { pane.ignoreX = v; render(pane); },
        );
        const syncCtl = buildToggleGroup(
            'Sync',
            'Sync naming ↔ list',
            'Keep Naming and Load list locked to the same game on this pane',
            pane.sync,
            v => { pane.sync = v; setSyncVisual(v); },
        );
        // Naming and Load list get a highlighted outline while Sync is on,
        // so it's visually clear the two groups are currently linked.
        function setSyncVisual(v) {
            namingCtl.el.classList.toggle('sync-linked', v);
            listCtl.el.classList.toggle('sync-linked', v);
        }
        setSyncVisual(pane.sync);
        const dedupCtl = buildToggleGroup(
            'Dedup',
            'Dedup identical rows',
            'Merge collision-id sub-rows that share the same level name into one summed row (only applies when grouped by Collision ID)',
            pane.dedup,
            v => { pane.dedup = v; render(pane); },
        );
        dedupCtl.setEnabled(pane.groupMode === 'id');

        toolbarEl.append(namingCtl.el, listCtl.el, groupCtl.el, byteCtl.el, syncCtl.el, dedupCtl.el);
    }

    panes.A.key = 'A';
    panes.B.key = 'B';
    buildPaneToolbar(panes.A);
    buildPaneToolbar(panes.B);

    renderAll();
</script>

</body>
</html>
